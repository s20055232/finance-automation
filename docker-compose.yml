# docker-compose.yml — 認證基礎設施（Ory Zero Trust）
#
# 這個檔案只跑「認證層」的服務，應用程式（FastAPI + Vue）在本機跑。
#
# 架構圖：
#
#   使用者瀏覽器
#       │
#       ▼ http://127.0.0.1:4455
#   ┌─────────────────────────────┐
#   │  Oathkeeper（反向代理）      │  ← 攔截所有 request，驗證 session
#   │  port 4455（public proxy）  │
#   └──────────┬──────────────────┘
#              │ 驗證 session
#              ▼ http://kratos:4433/sessions/whoami
#   ┌─────────────────────────────┐
#   │  Kratos（身份管理）          │  ← 負責登入、註冊、登出流程
#   │  port 4433（public API）    │
#   │  port 4434（admin API）     │
#   └──────────┬──────────────────┘
#              │ 寄驗證信
#              ▼ smtp://mailpit:1025
#   ┌─────────────────────────────┐
#   │  Mailpit（測試 email）       │  ← 攔截所有寄出的 email（arm64 + amd64）
#   │  port 8025（Web UI）        │
#   └─────────────────────────────┘
#
#   已驗證的 request 由 Oathkeeper 轉發到 →
#   FastAPI（本機 port 8000）或 Vite（本機 port 5173）
#
# 啟動指令：
#   make auth          → 背景啟動所有認證服務
#   make auth-down     → 停止並移除容器
#   make auth-logs     → 即時查看 log
#
# Secret 設定（複製 .env.example → .env，填入真實值）：
#   KRATOS_SECRET_COOKIE  Kratos session cookie 加密 key（32 字元）
#   KRATOS_SECRET_CIPHER  Kratos 資料加密 key（32 字元）

services:

  # ── Kratos：資料庫初始化（每次啟動前執行 migration）────────────────────────
  kratos-migrate:
    image: oryd/kratos:v1.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      - SECRETS_COOKIE=${KRATOS_SECRET_COOKIE}
      - SECRETS_CIPHER=${KRATOS_SECRET_CIPHER}
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./ory/kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - ory

  # ── Kratos：身份管理主服務 ───────────────────────────────────────────────────
  kratos:
    image: oryd/kratos:v1.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"   # public API（供 Oathkeeper 和前端呼叫）
      - "4434:4434"   # admin API（僅內部使用）
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./ory/kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
      - LOG_LEVEL=info
      - SECRETS_COOKIE=${KRATOS_SECRET_COOKIE}
      - SECRETS_CIPHER=${KRATOS_SECRET_CIPHER}
    restart: unless-stopped
    networks:
      - ory

  # ── Oathkeeper：Zero Trust 反向代理 ─────────────────────────────────────────
  oathkeeper:
    image: oryd/oathkeeper:v0.40.6
    depends_on:
      - kratos
    ports:
      - "4455:4455"   # public proxy（所有流量入口）
      - "4456:4456"   # admin API
    volumes:
      - ./ory/oathkeeper:/etc/config/oathkeeper
    command: serve proxy -c /etc/config/oathkeeper/oathkeeper.yml
    restart: unless-stopped
    networks:
      - ory
    # Mac / Windows 可用 host.docker.internal 連到本機
    # Linux 需要加這行：
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Mailpit：測試用 SMTP server ──────────────────────────────────────────────
  # Multi-platform：linux/amd64（fly.io）+ linux/arm64（Apple Silicon）
  # 取代 oryd/mailslurper（僅 amd64，無法在 M 系列 Mac 原生執行）
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP（Kratos 寄信到這裡）
      - "8025:8025"   # Web UI → http://127.0.0.1:8025
    networks:
      - ory

  # ── Odoo 18：ERP（真實 Vendor Bills 資料來源）────────────────────────────────
  #
  # 使用方式：
  #   make odoo           → 背景啟動 odoo + odoo-db
  #   http://localhost:8069 → 首次開啟需建立資料庫（DB=odoo, admin passwd 見下）
  #   make seed-odoo      → 植入 6 張示範 Vendor Bills
  #   make odoo-down      → 停止 Odoo 服務
  #
  # Apple Silicon（ARM64）相容：odoo:18 官方 Image 提供 linux/arm64 build。
  #
  # odoo_connector.py 所需的環境變數（設在 backend/.env）：
  #   ODOO_URL=http://localhost:8069
  #   ODOO_DB=odoo
  #   ODOO_USER=admin
  #   ODOO_API_KEY=<在 Odoo Settings → Users → API Keys 產生>

  odoo-db:
    image: postgres:16
    container_name: finance-odoo-db
    environment:
      # 不設定 POSTGRES_DB：讓 Odoo 透過 /web/database/manager 自行建立並初始化。
      # 若預先建立空 DB，Odoo 啟動時會直接嘗試載入空 schema → KeyError: 'ir.http'。
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - odoo

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  #
  # 使用方式：
  #   make backend        → 建置並背景啟動
  #   make backend-down   → 停止
  #   make backend-logs   → 即時 log
  #
  # 放在 ory network：Oathkeeper 可以直接用 http://backend:8000 轉發
  # 放在 odoo network：可以呼叫 Odoo XML-RPC（http://odoo:8069）
  #
  # backend/.env 需設定：
  #   ANTHROPIC_API_KEY, ODOO_API_KEY, ODOO_URL=http://odoo:8069
  backend:
    build:
      context: ./backend
    container_name: finance-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ODOO_URL=http://odoo:8069   # override .env: 容器內用 Docker hostname
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ory
      - odoo
    restart: unless-stopped

  odoo:
    image: odoo:18
    container_name: finance-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    # `-i base,account`：首次啟動自動建立 DB 並安裝 base + 會計模組（account）。
    # account 模組提供 account.move（Vendor Bills）和 Chart of Accounts，
    # 是 seed_odoo.py 和 odoo_connector.py 的必要依賴。
    # 首次啟動約需 5-8 分鐘；之後重啟 Odoo 會跳過已安裝的模組。
    command: -- -d odoo -i base,account --without-demo=all
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - odoo

volumes:
  kratos-sqlite:        # Kratos 使用 SQLite，資料持久化在這個 volume
  odoo-data:            # Odoo filestore（附件、PDF 等）
  odoo-db-data:         # Odoo PostgreSQL 資料

networks:
  ory:
    driver: bridge
  odoo:
    driver: bridge
