# ory/oathkeeper/access-rules.yml — 存取控制規則
#
# matching_strategy: regexp（見 oathkeeper.yml）
#
# Oathkeeper regexp 語法：
#   < > 括號內是 regexp，括號外是字面字串。
#   例：<https|http>://mydomain.com/<.*>
#       ^^^^^^^^^^^^^^^^ regexp      ^^^^ regexp
#                              ^^^^^^^^^^^^^^^ 字面字串
#
# 用 regexp 而非 glob 的原因：
#   glob 的 <**> 會跨越斜線貪婪匹配，導致 /src/api/client.ts
#   同時命中 public:assets（src/<**>）和 protected:api（<**>/api/<**>）→ 500。
#   regexp 用 <[^/]+> 限制 host 不可跨越斜線，才能正確錨定路徑開頭。

# ── 公開路由（不需登入）──────────────────────────────────────────────────────

- id: public:login
  match:
    url: "<https|http>://<[^/]+>/login<.*>"
    methods: [GET, POST]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:register
  match:
    url: "<https|http>://<[^/]+>/register<.*>"
    methods: [GET, POST]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:error
  match:
    url: "<https|http>://<[^/]+>/error<.*>"
    methods: [GET]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:recovery
  match:
    url: "<https|http>://<[^/]+>/recovery<.*>"
    methods: [GET, POST]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# Vite 內部模組路徑（@vite、@fs、@id）與靜態資源（assets、src）
# <[^/]+> 只匹配 host:port，不跨越斜線 → 不會和 /api/ 產生衝突
- id: public:assets
  match:
    url: "<https|http>://<[^/]+>/<assets|@vite|@fs|@id|node_modules|src>/<.*>"
    methods: [GET]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# 前端 SPA 主要頁面（auth 由 Vue 透過 Kratos 驗證，Oathkeeper 只做路由）
- id: public:app-root
  match:
    url: "<https|http>://<[^/]+>/"
    methods: [GET]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:app-pages
  match:
    url: "<https|http>://<[^/]+>/<dashboard|reports>"
    methods: [GET]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:favicon
  match:
    url: "<https|http>://<[^/]+>/favicon.ico"
    methods: [GET]
  upstream:
    url: "http://host.docker.internal:5173"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# ── Odoo（會計 ERP，自帶登入系統）─────────────────────────────────────────
#
# Oathkeeper 在 ory network，無法直接連 odoo container（odoo network）。
# 改用 host.docker.internal:8069（Odoo 已 map 到 host port）。
# --proxy-mode 讓 Odoo 讀取 X-Forwarded-Host，產生正確的 redirect URL。
- id: public:odoo
  match:
    url: "<https|http>://<[^/]+>/<web|odoo|longpolling><.*>"
    methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
  upstream:
    url: "http://host.docker.internal:8069"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# ── Kratos self-service（瀏覽器直接呼叫 Kratos，必須同源）──────────────────
#
# 根本問題：瀏覽器在 127.0.0.1:4455，若直接呼叫 localhost:4433 就是跨 site。
# SameSite=Lax cookie 不會在跨 site XHR 中送出 → Kratos 收不到 CSRF cookie → 403。
#
# 解法：把 /self-service/* 和 /sessions/whoami 也透過 Oathkeeper（4455）代理，
# 讓所有 Kratos API 呼叫都是同源（127.0.0.1:4455），避免 SameSite 限制。

- id: public:kratos-selfservice
  match:
    url: "<https|http>://<[^/]+>/self-service/<.*>"
    methods: [GET, POST]
  upstream:
    url: "http://kratos:4433"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: public:kratos-whoami
  match:
    url: "<https|http>://<[^/]+>/sessions/whoami"
    methods: [GET]
  upstream:
    url: "http://kratos:4433"
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# ── 受保護路由（需要登入）────────────────────────────────────────────────────

# FastAPI API endpoints — 驗證 session 並注入 X-User-ID / X-User-Email
# /api/ 開頭，<[^/]+> 確保 host 不跨越斜線，不會匹配 /src/api/ 這類路徑
- id: protected:api
  match:
    url: "<https|http>://<[^/]+>/api/<.*>"
    methods: [GET, POST, PUT, DELETE, PATCH]
  upstream:
    url: "http://backend:8000"
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
