# ory/kratos/kratos.yml — Kratos 身份管理設定
#
# ⚠️  這裡的 selfservice URL 是「本地預設值」，實際值由 docker-compose 的
#    SELFSERVICE_* 環境變數覆蓋（make demo 會自動注入 Cloudflare Tunnel URL）。

version: v1.2.0

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://127.0.0.1:4433/
    host: 0.0.0.0
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods: [POST, GET, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Cookie, Content-Type]
      exposed_headers: [Content-Type, Set-Cookie]
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  allowed_return_urls:
    - https://allenlaiproject.com
    - http://127.0.0.1:4455
    - http://127.0.0.1:5173

  methods:
    password:
      enabled: true

  flows:
    login:
      lifespan: 10m
      ui_url: http://127.0.0.1:4455/login

    registration:
      lifespan: 10m
      ui_url: http://127.0.0.1:4455/register
      after:
        password:
          hooks:
            - hook: session

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:4455/login

    recovery:
      enabled: true
      ui_url: http://127.0.0.1:4455/recovery

    verification:
      enabled: true
      ui_url: http://127.0.0.1:4455/verification
      after:
        default_browser_return_url: http://127.0.0.1:4455/

    settings:
      ui_url: http://127.0.0.1:4455/settings

    error:
      ui_url: http://127.0.0.1:4455/error

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

ciphers:
  algorithm: xchacha20-poly1305

secrets:
  cookie:
    - DEV-SECRET-COOKIE-CHANGE-IN-PROD
  cipher:
    - DEV-SECRET-CIPHER-CHANGE-IN-PROD

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?skip_ssl_verify=true

log:
  level: info
  format: text
  leak_sensitive_values: true
